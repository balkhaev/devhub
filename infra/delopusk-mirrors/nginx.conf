worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # URLs, query strings, cookies and credentials do not enter access logs.
    access_log off;
    server_tokens off;
    # Current coolify-proxy address on the coolify network, checked at deploy.
    set_real_ip_from 10.0.1.7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Translate only the named mirror's origin. Other origins remain subject
    # to the application's existing CSRF/CORS policy.
    map $http_origin $origin_for_crm {
        default $http_origin;
        'https://crm.balkhaev.com' 'https://crm.delopusk.ru';
        'https://api.crm.balkhaev.com' 'https://api.crm.delopusk.ru';
    }
    map $http_referer $referer_for_crm {
        default $http_referer;
        ~^https://crm\.balkhaev\.com(/.*)?$ https://crm.delopusk.ru$1;
        ~^https://api\.crm\.balkhaev\.com(/.*)?$ https://api.crm.delopusk.ru$1;
    }
    map $upstream_http_access_control_allow_origin $cors_for_crm {
        default $upstream_http_access_control_allow_origin;
        'https://crm.delopusk.ru' 'https://crm.balkhaev.com';
        'https://api.crm.delopusk.ru' 'https://api.crm.balkhaev.com';
    }
    map $http_origin $origin_for_ggpick {
        default $http_origin;
        'https://ggpick.balkhaev.com' 'https://ggpick.club';
    }
    map $http_referer $referer_for_ggpick {
        default $http_referer;
        ~^https://ggpick\.balkhaev\.com(/.*)?$ https://ggpick.club$1;
    }
    map $http_origin $origin_for_altay {
        default $http_origin;
        'https://altay-mirror.balkhaev.com' 'https://altay.delopusk.ru';
    }

    # Fixed destination avoids an open proxy, DNS loops and alias redirects.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header X-Forwarded-Proto https;
    # Application-facing host must match its canonical origin (Next actions).
    proxy_set_header X-Forwarded-Host $proxy_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding '';
    proxy_hide_header Alt-Svc;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Never retry mutations after a partial/uncertain upstream response.
    proxy_next_upstream off;
    sub_filter_once off;
    sub_filter_types text/css application/javascript text/javascript text/x-component;

    server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { return 200 'ok\n'; }
        location / { return 421; }
    }
    server {
        listen 8080;
        server_name crm.balkhaev.com;
        location / {
            proxy_pass https://81.90.31.214;
            proxy_ssl_name crm.delopusk.ru;
            proxy_set_header Host crm.delopusk.ru;
            proxy_set_header X-Forwarded-Host crm.delopusk.ru;
            proxy_set_header Origin $origin_for_crm;
            proxy_set_header Referer $referer_for_crm;
            proxy_set_header Accept-Encoding '';
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cookie_domain delopusk.ru crm.balkhaev.com;
            proxy_cookie_domain crm.delopusk.ru crm.balkhaev.com;
            proxy_redirect https://api.crm.delopusk.ru/ https://api.crm.balkhaev.com/;
            proxy_redirect https://crm.delopusk.ru/ https://crm.balkhaev.com/;
            sub_filter 'api.crm.delopusk.ru' 'api.crm.balkhaev.com';
            sub_filter 'crm.delopusk.ru' 'crm.balkhaev.com';
        }
    }
    server {
        listen 8080;
        server_name api.crm.balkhaev.com;
        location / {
            proxy_pass https://81.90.31.214;
            proxy_ssl_name api.crm.delopusk.ru;
            proxy_set_header Host api.crm.delopusk.ru;
            proxy_set_header X-Forwarded-Host api.crm.delopusk.ru;
            proxy_set_header Origin $origin_for_crm;
            proxy_set_header Referer $referer_for_crm;
            proxy_set_header Accept-Encoding '';
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cookie_domain delopusk.ru crm.balkhaev.com;
            proxy_cookie_domain crm.delopusk.ru crm.balkhaev.com;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_for_crm always;
            proxy_redirect https://api.crm.delopusk.ru/ https://api.crm.balkhaev.com/;
            proxy_redirect https://crm.delopusk.ru/ https://crm.balkhaev.com/;
        }
    }
    server {
        listen 8080;
        server_name ggpick.balkhaev.com;
        location / {
            proxy_pass https://81.90.31.214;
            proxy_ssl_name ggpick.club;
            proxy_set_header Host ggpick.club;
            proxy_set_header X-Forwarded-Host ggpick.club;
            proxy_set_header Origin $origin_for_ggpick;
            proxy_set_header Referer $referer_for_ggpick;
            proxy_set_header Accept-Encoding '';
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cookie_domain ggpick.club ggpick.balkhaev.com;
            proxy_cookie_domain delopusk.ru ggpick.balkhaev.com;
            proxy_redirect https://ggpick.club/ https://ggpick.balkhaev.com/;
            proxy_redirect https://ggpick.delopusk.ru/ https://ggpick.balkhaev.com/;
            sub_filter 'https://ggpick.club' 'https://ggpick.balkhaev.com';
            sub_filter 'https://ggpick.delopusk.ru' 'https://ggpick.balkhaev.com';
        }
    }
    server {
        listen 8080;
        server_name altay-mirror.balkhaev.com;
        location / {
            proxy_pass https://81.90.31.214;
            proxy_ssl_name altay.delopusk.ru;
            proxy_set_header Host altay.delopusk.ru;
            proxy_set_header X-Forwarded-Host altay.delopusk.ru;
            proxy_set_header Origin $origin_for_altay;
            proxy_set_header Accept-Encoding '';
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect https://altay.delopusk.ru/ https://altay-mirror.balkhaev.com/;
            proxy_redirect https://xn--80aaphjkeh3cyi.xn--p1ai/ https://altay-mirror.balkhaev.com/;
            sub_filter 'https://altay.delopusk.ru' 'https://altay-mirror.balkhaev.com';
            sub_filter 'https://xn--80aaphjkeh3cyi.xn--p1ai' 'https://altay-mirror.balkhaev.com';
        }
    }
}
