name: delopusk-resource-mirrors
services:
  mirror:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: delopusk-resource-mirrors
    restart: unless-stopped
    user: nginx
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [coolify]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      retries: 3
networks:
  coolify:
    external: true
